description: >-
  Ubble is a Paris-founded identity verification company, now part of Checkout.com
  and operated as the Checkout.com Identity Verification (Identities) solution.
  Its API at api.ubble.ai powers video-based identity verification, ID document
  verification, AML screening with ongoing monitoring, biometric face
  authentication, and address/bank/company document and website verifications,
  with a hosted capture flow, CloudEvents webhooks signed with ECDSA/SHA-512, and
  a published OpenAPI 3.0.3 contract.
