        configuration_identifier:
          type: string
          description: Configuration identifier
          example: "12345678-1234-1234-1234-123456789012"

    SelectedDocument:
      type: object
      description: The code giving more details about the result.
      properties:
        country:
          $ref: "#/components/schemas/CountryCodeIso2"
        document_type:
          $ref: "#/components/schemas/DocumentTypes"
      required:
        - country
        - document_type

    SelfLink:
      type: object
      required: [self]
      properties:
        self:
          $ref: "#/components/schemas/HalLink"

    UserJourneyId:
      type: string
      description: User journey unique identifier.
      pattern: ^usj_\w+$
      example: usj_tkoi5db4hryu5cei5vwoabr7we

    VerificationFace:
      type: object
      properties:
        image_signed_url:
          type: string
          nullable: true

    VerificationIdentity:
      type: object
      description: IdentitySerializer for our main Identity model
      properties:
        first_names:
          type: string
          nullable: true
        full_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        last_name_at_birth:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        birth_place:
          type: string
          nullable: true
          maxLength: 255
        nationality:
          type: string
        gender:
          type: string
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/GenderA47Enum'
            - $ref: '#/components/schemas/BlankEnum'
            - $ref: '#/components/schemas/NullEnum'

    VerificationStatuses:
      type: string
      description: Status of the verification.
      enum:
        - created
        - pending
        - capture_in_progress
        - checks_in_progress
        - approved
        - declined
        - retry_required
        - refused
        - inconclusive

    WebsiteVerificationBase:
      type: object
      properties:
        user_journey_id:
          allOf:
            - $ref: "#/components/schemas/UserJourneyId"
        applicant_id:
          allOf:
            - $ref: "#/components/schemas/BusinessApplicantId"
        webhook_url:
          type: string
          format: uri
        website_url:
          type: string
          format: uri
          maxLength: 1024
          description: URL of the website to be verified

    WebsiteVerificationId:
      type: string
      description: Website verification unique identifier.
      pattern: ^wbv_\w+$
      example: wbv_tkoi5db4hryu5cei5vwoabr7we

    WebsiteVerificationInputBase:
      type: object
      allOf:
        - $ref: "#/components/schemas/WebsiteVerificationBase"

    WebsiteVerificationInputPost:
      type: object
      required: [applicant_id, user_journey_id, website_url]
      allOf:
        - $ref: "#/components/schemas/WebsiteVerificationInputBase"

    WebsiteVerificationLinks:
      type: object
      allOf:
        - $ref: "#/components/schemas/SelfLink"
        - $ref: "#/components/schemas/ApplicantLink"

    WebsiteVerificationOutputAnonymize:
      type: object
      required: [id, status, applicant_id, response_codes, risk_labels, user_journey_id, website_url, _links]
      allOf:
        - $ref: "#/components/schemas/DatedObject"
        - $ref: "#/components/schemas/WebsiteVerificationOutputBase"

    WebsiteVerificationOutputBase:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/WebsiteVerificationId"
        status:
          $ref: "#/components/schemas/WebsiteVerificationStatus"
        response_codes:
          type: array
          items:
            $ref: "#/components/schemas/ResponseCodes"
        risk_labels:
          $ref: "#/components/schemas/RiskLabels"
        website_data:
          $ref: "#/components/schemas/WebsiteVerificationResult"
        _links:
          $ref: "#/components/schemas/WebsiteVerificationLinks"
      allOf:
        - $ref: "#/components/schemas/WebsiteVerificationBase"
        - $ref: "#/components/schemas/DatedObject"

    WebsiteVerificationOutputGet:
      type: object
      required: [id, status, applicant_id, response_codes, risk_labels, user_journey_id, website_url, _links]
      allOf:
        - $ref: "#/components/schemas/DatedObject"
        - $ref: "#/components/schemas/WebsiteVerificationOutputBase"

    WebsiteVerificationOutputPost:
      type: object
      required: [id, status, applicant_id, response_codes, risk_labels, user_journey_id, website_url, _links]
      allOf:
        - $ref: "#/components/schemas/WebsiteVerificationOutputBase"

    WebsiteVerificationResult:
      type: object
      properties:
        legal_name:
          type: string
          description: Legal name of the company
        country_of_incorporation:
          $ref: "#/components/schemas/CountryCodeIso2"
          description: Country of incorporation of the company
        mccs:
          type: array
          items:
            type: string
          description: MCCs of the company
        alternative_mccs:
          type: array
          items:
            type: string
          description: Alternative MCCs of the company
        mcc_rationale:
          type: string
          description: Rationale for the MCCs
        risky_activities:
          type: array
          items:
            type: string
          description: Risky activities of the company
        legal_address:
          $ref: "#/components/schemas/Address"
        disclosure_urls:
          $ref: "#/components/schemas/DisclosureURLs"
        registration_date:
          type: string
          format: date
          nullable: true
          description: The registration date of the domain

    WebsiteVerificationStatus:
      type: string
      description: Status of the website verification.
      enum:
        - initial_status
        - created
        - checks_in_progress
        - approved
        - declined
        - inconclusive

