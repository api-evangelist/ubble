components:
  schemas:
    AMLVerificationBase:
      type: object
      allOf:
        - properties:
            webhook_url:
              type: string
              format: uri
            applicant_id:
              allOf:
                - $ref: "#/components/schemas/ApplicantId"
            search_parameters:
              $ref: "#/components/schemas/SearchParameters"
            monitored:
              type: boolean

    AMLVerificationId:
      type: string
      description: AML verification unique identifier.
      pattern: ^amlv_\w+$
      example: amlv_tkoi5db4hryu5cei5vwoabr7we

    AMLVerificationInputBase:
      type: object
      allOf:
        - $ref: "#/components/schemas/AMLVerificationBase"

    AMLVerificationInputPost:
      type: object
      required: [webhook_url, applicant_id, search_parameters]
      allOf:
        - $ref: "#/components/schemas/AMLVerificationInputBase"

    AMLVerificationLinks:
      type: object
      allOf:
        - $ref: "#/components/schemas/SelfLink"
        - $ref: "#/components/schemas/ApplicantLink"

    AMLVerificationOutputBase:
      type: object
      properties:
        status:
          allOf:
            - $ref: "#/components/schemas/AMLVerificationStatuses"
        _links:
          allOf:
            - $ref: "#/components/schemas/AMLVerificationLinks"
      allOf:
        - $ref: "#/components/schemas/AMLVerificationBase"

    AMLVerificationOutputGet:
      type: object
      required: [id, status, webhook_url, _links, applicant_id, search_parameters]
      properties:
        id:
          $ref: "#/components/schemas/AMLVerificationId"
      allOf:
        - $ref: "#/components/schemas/DatedObject"
        - $ref: "#/components/schemas/AMLVerificationOutputBase"

    AMLVerificationOutputPost:
      type: object
      required: [id, status, webhook_url, _links, applicant_id, search_parameters]
      properties:
        id:
          $ref: "#/components/schemas/AMLVerificationId"
      allOf:
        - $ref: "#/components/schemas/DatedObject"
        - $ref: "#/components/schemas/AMLVerificationOutputBase"

    AMLVerificationStatuses:
      type: string
      description: Status of the AML verification.
      enum:
        - created
        - screening_in_progress
        - approved
        - declined
        - review_required

    AccountTypes:
      type: string
      description: Type of account.
      enum:
        - checking
        - savings

    ActiveLink:
      type: object
      required: [verification_url]
      properties:
        verification_url:
          $ref: "#/components/schemas/HalLink"

    Address:
      type: object
      properties:
        address_line1:
          type: string
          maxLength: 250
        address_line2:
          type: string
          maxLength: 250
        city:
          type: string
          maxLength: 50
        state:
          type: string
          maxLength: 50
        zip:
          type: string
          maxLength: 50
        country:
          $ref: "#/components/schemas/CountryCodeIso2"

    AddressDocumentVerificationAttemptAsset:
      type: object
      required: [type, _links]
      properties:
        type:
          type: string
          description: Type of asset
          enum:
            - document
        _links:
          type: object
          properties:
            asset_url:
              type: object
              properties:
                href:
                  type: string
                  format: uri

    AddressDocumentVerificationAttemptAssetsOutput:
      type: object
      required: [total_count, skip, limit, _links, data]
      properties:
        data:
          type: array
          description: Array of Address Document Verification attempt assets for the current page
          minItems: 0
          items:
            $ref: "#/components/schemas/AddressDocumentVerificationAttemptAsset"
      allOf:
        - $ref: "#/components/schemas/BaseOutputList"

    AddressDocumentVerificationAttemptInputBase:
      type: object
      properties:
        document:
          type: string
          format: binary

    AddressDocumentVerificationAttemptInputPost:
      type: object
      required: [document]
      allOf:
        - $ref: "#/components/schemas/AddressDocumentVerificationAttemptInputBase"

    AddressDocumentVerificationAttemptOutputBase:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/AddressDocumentVerificationAttemptStates"
        response_codes:
          type: array
          minItems: 0
          items:
