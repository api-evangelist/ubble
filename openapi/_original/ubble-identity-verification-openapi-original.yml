        "500":
          description: An error occurred while fetching the attempts
    post:
      tags:
        - ID document verifications
      summary: Create an ID document verification attempt
      description: "This endpoint allows you to create an ID document verification attempt. It is possible when the ID document verification 
        is one of the following statuses: `created`, `retry_required`"
