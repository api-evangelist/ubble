generated: '2026-07-21'
method: searched
source: https://docs.ubble.ai/docs/reference-info/response-codes
notes: >-
  Verification response-code registry for the v2 Identities API (the non-payments
  sibling of a decline-code table). Codes appear in the response_codes[] array on
  verifications, attempts, and webhook payloads. Applicability flags per product:
  idv (identity verification), certified idv, fav (face authentication), iddv
  (ID document verification), wbv (website verification). Adding new codes is
  documented as backward compatible - key business rules on statuses, not codes.
envelope_field: response_codes
groups:
  - group: approved
    check_status: approved
    codes:
      - {code: 10000, summary: approved, description: The verification has been approved}
  - group: applicant-engagement-issue
