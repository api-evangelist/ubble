      - {code: 61112, summary: applicant_no_document, description: Applicant stated they did not have their document}
      - {code: 61113, summary: camera_access_refused, description: Applicant did not give camera access}
      - {code: 61121, summary: applicant_drop, description: Applicant left before capture and the URL expired (default 15 minutes)}
